# Проверка стиля и типичных ошибок: .venv/Scripts/ruff check .
# Те же правила — для скрипта проверки миграции (db/ruff.toml ссылается сюда).

line-length = 110
target-version = "py312"
src = [".", "../db"]

[lint]
select = [
    "F",      # pyflakes: неиспользуемое, неопределённое, затенённые имена
    "E",      # pycodestyle: ошибки оформления
    "W",      # pycodestyle: предупреждения (пробелы, пустые строки)
    "I",      # isort: порядок импортов
    "B",      # bugbear: вероятные ошибки (изменяемые значения по умолчанию, замыкания в цикле…)
    "N",      # pep8-naming: имена функций, переменных, констант
    "UP",     # pyupgrade: устаревшие конструкции для Python 3.12
    "C4",     # comprehensions: лишние list()/dict() вокруг генераторов
    "BLE",    # перехват голого Exception — только осознанно, с пометкой noqa и причиной
    "RUF100", # пометка noqa, которая ничего не подавляет
]

[lint.isort]
known-first-party = ["delivery", "check_migration"]
